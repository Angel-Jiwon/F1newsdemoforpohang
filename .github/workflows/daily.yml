name: 오늘의 F1 브리핑

on:
  schedule:
    # UTC 23:00 = KST 08:00 (다음날). GitHub 는 UTC 로만 받는다.
    # 부하에 따라 몇 분에서 수십 분 늦게 시작될 수 있다.
    - cron: "0 23 * * *"
  workflow_dispatch:        # Actions 탭에서 수동 실행용

# docs/index.html 과 data/seen.json 을 커밋해야 하므로 쓰기 권한이 필요하다.
permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 브리핑 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python src/main.py

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/archive data/seen.json
          # 기사가 그대로면 변경이 없다. 그때는 조용히 넘어간다.
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "브리핑 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
